<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Circular Queue Using Linked List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Circular Queue Using Linked List</h1>
        <p class="subtitle">Data Structure Project</p>
        
        <div class="controls">

            <input
                type="number"
                id="valueInput"
                placeholder="Enter value"
            >

            <button onclick="insert()">Insert</button>

            <button onclick="deleteNode()">Delete</button>

            <button onclick="search()">Search</button>

            <button onclick="display()">Display</button>

            <button onclick="clearQueue()">Clear</button>

        </div>
        <div class="status">

            <div>
                <strong>Front:</strong>
                <span id="frontValue">-</span>
            </div>

            <div>
                <strong>Rear:</strong>
                <span id="rearValue">-</span>
            </div>

        </div>

        <h2>Queue</h2>

        <div id="queueContainer" class="queue-container">
            <p class="empty">Queue is empty</p>
        </div>

        <div id="message" class="message">
            Ready
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
