<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Circular Queue Using Linked List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Circular Queue Using Linked List</h1>

        <p class="subtitle">
            Data Structure Project
        </p>

        <div class="input-section">

            <input
                type="number"
                id="valueInput"
                placeholder="Enter value"
            >

            <button onclick="insertElement()">
                Insert
            </button>

            <button onclick="deleteElement()">
                Delete
            </button>

            <button onclick="searchElement()">
                Search
            </button>

            <button onclick="displayQueue()">
                Display
            </button>

            <button onclick="clearQueue()">
                Clear
            </button>

        </div>

        <div class="info">

            <p>
                <strong>Front:</strong>
                <span id="frontValue">-</span>
            </p>

            <p>
                <strong>Rear:</strong>
                <span id="rearValue">-</span>
            </p>

        </div>

        <h2>Queue</h2>

        <div id="queueDisplay" class="queue-display">
            Queue is empty
        </div>

        <div id="message" class="message">
            Ready
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
